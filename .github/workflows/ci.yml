name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: server/requirements*.txt }
      - run: pip install -r server/requirements-dev.txt
      - run: ruff check server evals scripts
      - run: ruff format --check server evals scripts
      - run: mypy server
      - run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=85
      - run: pip-audit -r server/requirements.txt

  backend-postgres:
    name: Backend · Postgres + migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: nexus, POSTGRES_PASSWORD: nexus, POSTGRES_DB: nexus }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nexus" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://nexus:nexus@localhost:5432/nexus
      TEST_DATABASE_URL: postgresql+asyncpg://nexus:nexus@localhost:5432/nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: server/requirements*.txt }
      - run: pip install -r server/requirements-dev.txt
      - name: Migrations apply, roll back and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - run: pytest -q

  evals:
    name: Evals · golden set + red team
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: server/requirements*.txt }
      - run: pip install -r server/requirements.txt
      - run: python -m evals.run_evals
        env: { LLM_PROVIDERS: none, LOG_LEVEL: WARNING }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: evals/reports/latest.json }

  contract:
    name: API contract is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: server/requirements*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: pip install -r server/requirements.txt && npm ci
      - run: npm run gen:api
      - name: Fail if openapi.json or src/api/schema.ts changed
        run: git diff --exit-code -- openapi.json src/api/schema.ts

  frontend:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check "src/**/*.{ts,tsx}" "e2e/**/*.ts"
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end · Playwright + axe
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: server/requirements*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: pip install -r server/requirements.txt && npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p test-results && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: Dockerfile.api, push: false, tags: "nexus-api:ci" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: Dockerfile.web, push: false, tags: "nexus-web:ci" }

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # required only for organisation-owned repos
