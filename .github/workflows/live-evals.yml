name: Live evals

# Scores real model output against the golden set (costs tokens). Run on demand, and weekly to
# catch provider-side drift. Requires repository secrets OPENAI_API_KEY and/or ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of golden missions (0 = all)"
        default: "15"
  schedule:
    - cron: "41 6 * * 3"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    environment: evals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: server/requirements*.txt }
      - run: pip install -r server/requirements.txt
      - run: python -m evals.run_evals --live --limit "${{ github.event.inputs.limit || '15' }}" --concurrency 3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LOG_LEVEL: WARNING
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: live-eval-report, path: evals/reports/latest.json }
