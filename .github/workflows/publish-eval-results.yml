name: Publish eval results

# Re-publish the ablation results of an earlier "Ablation (Ollama)" run onto a branch based on the latest main.
# Use when that run's own publish step could not push (e.g. main changed while it ran).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID of the Ablation (Ollama) run"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: server/requirements*.txt }
      - run: pip install -r server/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: ablation-part-*
          path: artifacts
      - name: Merge shards
        run: |
          parts=$(find artifacts -name 'part-*.json' | sort)
          test -n "$parts" || { echo "no shard outputs found for run ${{ inputs.run_id }}"; exit 1; }
          python -m evals.ablation --merge $parts --out merged.json --results-dir evals/results
          cat evals/results/ablation-latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Push results branch (based on latest main, so no workflow files differ)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "eval-results/${{ inputs.run_id }}"
          git add evals/results
          git commit -m "eval: ablation results from run ${{ inputs.run_id }}"
          git push --force origin "eval-results/${{ inputs.run_id }}"
