name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: Who is affected and how? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal }
  - type: textarea
    id: success
    attributes: { label: How will we measure success? }
